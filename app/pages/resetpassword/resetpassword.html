<div class="auth-page">
  <ui-card bg="light" shadow elevation="lg" rounded="true" class="auth-card">
    <div class="auth-body">

      <div class="auth-logo">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="24" cy="24" r="24" fill="#192836"/>
          <path d="M9 18 Q14 13 19 18 Q24 23 29 18 Q34 13 39 18" stroke="white" stroke-width="2.3" fill="none" stroke-linecap="round"/>
          <path d="M9 25 Q14 20 19 25 Q24 30 29 25 Q34 20 39 25" stroke="white" stroke-width="2.3" fill="none" stroke-linecap="round"/>
          <path d="M9 32 Q14 27 19 32 Q24 37 29 32 Q34 27 39 32" stroke="white" stroke-width="2.3" fill="none" stroke-linecap="round"/>
        </svg>
      </div>

      <div id="formSection">
        <h1 class="auth-title">Choose New Password</h1>
        <p class="auth-subtitle">Enter a new password for your account.</p>

        <form id="resetForm" novalidate>

          <div class="field-group">
            <label class="field-label">New Password</label>
            <ui-input
              id="password"
              name="password"
              type="password"
              placeholder="Min. 8 characters"
              icon="lock"
              icon-position="right"
              required
              minlength="8"
            ></ui-input>
          </div>

          <div class="field-group">
            <label class="field-label">Confirm Password</label>
            <ui-input
              id="confirmPassword"
              name="confirmPassword"
              type="password"
              placeholder="Repeat new password"
              icon="lock"
              icon-position="right"
              required
            ></ui-input>
          </div>

          <div id="errorMessage" class="auth-error" role="alert" aria-live="polite"></div>

          <ui-button
            type="submit"
            id="submitBtn"
            variant="primary"
            size="lg"
            icon="check"
            class="auth-submit"
          >Set New Password</ui-button>

        </form>
      </div>

      <div id="invalidTokenSection" class="auth-success-section" style="display:none">
        <div class="auth-success-icon auth-error-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="48" height="48">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
        </div>
        <h1 class="auth-title" style="color:#dc2626">Link Expired</h1>
        <p class="auth-subtitle">This password reset link is invalid or has expired.</p>
        <p class="auth-back-link"><a href="/forgot-password" class="auth-link">Request a new link</a></p>
      </div>

      <div id="successSection" class="auth-success-section" style="display:none">
        <div class="auth-success-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#00c9a7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="48" height="48">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            <polyline points="22 4 12 14.01 9 11.01"/>
          </svg>
        </div>
        <h1 class="auth-title">Password updated!</h1>
        <p class="auth-subtitle">Your password has been changed. You can now sign in with your new password.</p>
        <p class="auth-back-link"><a href="/" class="auth-link">← Go to Sign In</a></p>
      </div>

    </div>
  </ui-card>
</div>
