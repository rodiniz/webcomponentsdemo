<div class="auth-page">
  <ui-card bg="light" shadow elevation="lg" rounded="true" class="auth-card">
    <div class="auth-body">

      <div class="auth-logo">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="24" cy="24" r="24" fill="#192836"/>
          <path d="M9 18 Q14 13 19 18 Q24 23 29 18 Q34 13 39 18" stroke="white" stroke-width="2.3" fill="none" stroke-linecap="round"/>
          <path d="M9 25 Q14 20 19 25 Q24 30 29 25 Q34 20 39 25" stroke="white" stroke-width="2.3" fill="none" stroke-linecap="round"/>
          <path d="M9 32 Q14 27 19 32 Q24 37 29 32 Q34 27 39 32" stroke="white" stroke-width="2.3" fill="none" stroke-linecap="round"/>
        </svg>
      </div>

      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Don't have an account? <a href="/signup" class="auth-link">Create today!</a></p>

      <form id="loginForm" novalidate>

        <div class="field-group">
          <label class="field-label">Email Address</label>
          <ui-input
            icon="mail"
            id="email"
            name="email"
            type="email"
            placeholder="Email address"
            required
          ></ui-input>
        </div>

        <div class="field-group">
          <label class="field-label">Password</label>
          <ui-input
            id="password"
            name="password"
            type="password"
            placeholder="Password"
            icon="lock"
            icon-position="right"
            required
          ></ui-input>
        </div>
       
        <p class="auth-forgot"><a href="/forgot-password" class="auth-link">Forgot your password?</a></p>

        <div id="errorMessage" class="auth-error" role="alert" aria-live="polite"></div>

        <ui-button
          type="submit"
          id="submitBtn"
          variant="primary"
          size="lg"
          icon="user"
          class="auth-submit"
        >Sign In</ui-button>

      </form>

    </div>
  </ui-card>
</div>
