<div class="auth-shell">

  <!-- Left decorative brand panel -->
  <div class="auth-panel auth-panel--brand" aria-hidden="true">
    <div class="brand-grid"></div>
    <div class="brand-orb brand-orb--1"></div>
    <div class="brand-orb brand-orb--2"></div>
    <div class="brand-orb brand-orb--3"></div>
    <div class="brand-content">
      <div class="brand-logo">
        <svg class="brand-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="12" height="12" rx="2" fill="#00c9a7" opacity="0.9"/>
          <rect x="18" y="2" width="12" height="12" rx="2" fill="#00c9a7" opacity="0.4"/>
          <rect x="2" y="18" width="12" height="12" rx="2" fill="#00c9a7" opacity="0.4"/>
          <rect x="18" y="18" width="12" height="12" rx="2" fill="#00c9a7" opacity="0.9"/>
        </svg>
        <span class="brand-wordmark">DEMO</span>
      </div>
      <h2 class="brand-headline">Start building<br>something<br>great today.</h2>
      <p class="brand-sub">Free to start. No credit card required.</p>
      <div class="brand-divider"></div>
      <ul class="brand-features">
        <li>
          <span class="feature-check">✓</span>
          Organized workspaces
        </li>
        <li>
          <span class="feature-check">✓</span>
          Secure by default
        </li>
        <li>
          <span class="feature-check">✓</span>
          Ready in seconds
        </li>
      </ul>
    </div>
    <div class="brand-scan"></div>
  </div>

  <!-- Right form panel -->
  <div class="auth-panel auth-panel--form">
    <div class="form-container">

      <div class="form-eyebrow">
        <svg class="form-eyebrow-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="12" height="12" rx="2" fill="#00c9a7" opacity="0.9"/>
          <rect x="18" y="2" width="12" height="12" rx="2" fill="#00c9a7" opacity="0.4"/>
          <rect x="2" y="18" width="12" height="12" rx="2" fill="#00c9a7" opacity="0.4"/>
          <rect x="18" y="18" width="12" height="12" rx="2" fill="#00c9a7" opacity="0.9"/>
        </svg>
        <span>DEMO</span>
      </div>

      <div class="form-header">
        <h1 class="form-title">Create account</h1>
        <p class="form-subtitle">Join and get started in under a minute</p>
      </div>

      <form id="signupForm" class="auth-form" novalidate>    

        <div class="field-group">
          <ui-input
            id="email"
            name="email"
            type="email"
            label="Email"
            placeholder="you@example.com"
            icon="mail"
            icon-position="right"
            required
          ></ui-input>
        </div>

        <div class="field-group">
          <ui-input
            id="password"
            name="password"
            type="password"
            label="Password"
            placeholder="Min. 8 characters"
            icon="lock"
            icon-position="right"
            required
          ></ui-input>
        </div>

        <div id="errorMessage" class="auth-error" role="alert" aria-live="polite"></div>

        <ui-button
          type="submit"
          id="submitBtn"
          variant="primary"
          size="lg"
          class="auth-submit"
        >Create Account</ui-button>
      </form>

      <div class="form-footer">
        <span>Already have an account?</span>
        <a href="/" class="form-link">Sign in →</a>
      </div>

    </div>
  </div>

</div>
<ui-toast id="signupToast" position="top-right"></ui-toast>
