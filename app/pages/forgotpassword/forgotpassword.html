<div class="auth-page">
  <ui-card bg="light" shadow elevation="lg" rounded="true" class="auth-card">
    <div class="auth-body">

      <div class="auth-logo">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="24" cy="24" r="24" fill="#192836"/>
          <path d="M9 18 Q14 13 19 18 Q24 23 29 18 Q34 13 39 18" stroke="white" stroke-width="2.3" fill="none" stroke-linecap="round"/>
          <path d="M9 25 Q14 20 19 25 Q24 30 29 25 Q34 20 39 25" stroke="white" stroke-width="2.3" fill="none" stroke-linecap="round"/>
          <path d="M9 32 Q14 27 19 32 Q24 37 29 32 Q34 27 39 32" stroke="white" stroke-width="2.3" fill="none" stroke-linecap="round"/>
        </svg>
      </div>

      <div id="formSection">
        <h1 class="auth-title">Forgot Password</h1>
        <p class="auth-subtitle">Enter your email and we'll send you a reset link.</p>

        <form id="forgotForm" novalidate>

          <div class="field-group">
            <label class="field-label">Email Address</label>
            <ui-input
              icon="mail"
              id="email"
              name="email"
              type="email"
              placeholder="Email address"
              required
            ></ui-input>
          </div>

          <div id="errorMessage" class="auth-error" role="alert" aria-live="polite"></div>

          <ui-button
            type="submit"
            id="submitBtn"
            variant="primary"
            size="lg"
            icon="send"
            class="auth-submit"
          >Send Reset Link</ui-button>

        </form>

        <p class="auth-back-link"><a href="/" class="auth-link">← Back to Sign In</a></p>
      </div>

      <div id="successSection" class="auth-success-section" style="display:none">
        <div class="auth-success-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#00c9a7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="48" height="48">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.37 2 2 0 0 1 3.6 1h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.6a16 16 0 0 0 6 6l.97-.97a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21.73 16z"/>
          </svg>
        </div>
        <h1 class="auth-title">Check your inbox</h1>
        <p class="auth-subtitle">If that email exists in our system, a password reset link is on its way.</p>
        <p class="auth-back-link"><a href="/" class="auth-link">← Back to Sign In</a></p>
      </div>

    </div>
  </ui-card>
</div>
